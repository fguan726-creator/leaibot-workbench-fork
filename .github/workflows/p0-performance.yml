name: P0 performance gate
on:
  pull_request:
    paths:
      - 'public/leaip0/**'
      - 'scripts/*p0*'
      - '.github/workflows/p0-performance.yml'
  push:
    branches: [main]
    paths:
      - 'public/leaip0/**'
      - 'scripts/*p0*'
      - '.github/workflows/p0-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/check-p0-performance.cjs
      - run: node scripts/test-p0-lifecycle.cjs
