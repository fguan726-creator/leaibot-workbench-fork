<head>

  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --brand: #5d135b;
      --red: #c51f32;
      --surface: #fff;
      --canvas: #f5f5f7;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; background: transparent; color: var(--ink); }
    button { font: inherit; }
    .page {
      width: 100%;
      min-width: 980px;
      padding: 18px 0 16px;
      background: transparent;
    }
    .carousel-arrow:focus-visible, .carousel-dot:focus-visible {
      outline: 3px solid rgba(112,52,108,.24);
      outline-offset: 2px;
    }
    .hero {
      position: relative;
      display: block;
      height: 560px;
      min-height: 560px;
      overflow: hidden;
      border-radius: 20px;
      background: #0b0c12;
      box-shadow: 0 2px 6px rgba(22,14,26,.035), 0 8px 20px rgba(22,14,26,.065);
      isolation: isolate;
    }
    .hero-copy {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: min(46%, 580px);
      min-width: 0;
      padding: 58px 46px 56px 56px;
      background: transparent;
      color: #fff;
      text-shadow: 0 2px 18px rgba(0,0,0,.22);
    }
    .eyebrow {
      align-self: flex-start;
      margin: 0 0 14px;
      padding: 5px 10px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: rgba(255,255,255,.96);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .product-name { margin: 0 0 7px; color: rgba(255,255,255,.82); font-size: 17px; font-weight: 650; }
    .hero-title {
      max-width: 430px;
      margin: 0;
      font-size: clamp(34px,3vw,48px);
      font-weight: 720;
      line-height: 1.12;
      letter-spacing: -1.5px;
      color: #fff;
    }
    .hero-desc {
      max-width: 425px;
      margin: 18px 0 0;
      color: rgba(255,255,255,.76);
      font-size: 15px;
      line-height: 1.65;
    }
    .hero-purchase { display: none; }
    .price { display: flex; align-items: baseline; gap: 3px; color: #fff; white-space: nowrap; text-shadow: 0 2px 18px rgba(0,0,0,.28); }
    .price-symbol { font-size: 16px; font-weight: 700; }
    .price-value { font-size: 28px; font-weight: 760; letter-spacing: -.8px; }
    .price-suffix { font-size: 13px; font-weight: 650; }
    .hero-visual { position: absolute; inset: 0; z-index: 0; min-width: 0; overflow: hidden; background: #0b0c12; }
    .hero-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg,rgba(5,7,13,.92) 0%,rgba(7,8,14,.78) 26%,rgba(7,8,14,.48) 45%,rgba(7,8,14,.16) 69%,rgba(4,6,10,.08) 100%),
        linear-gradient(180deg,rgba(3,4,8,.10) 0%,rgba(3,4,8,.02) 54%,rgba(3,4,8,.25) 100%);
    }
    .hero-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .56s cubic-bezier(.22,.61,.36,1);
    }
    .hero-image.is-active { opacity: 1; }
    .hero-copy > * { transition: opacity .28s ease, transform .28s ease; }
    .hero.is-changing .hero-copy > * { opacity: .22; transform: translateY(4px); }
    .hero-products {
      position: absolute;
      z-index: 4;
      right: 28px;
      bottom: 28px;
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 4px;
      width: min(50%,640px);
      height: 106px;
      padding: 7px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 22px;
      background: rgba(8,10,18,.38);
      box-shadow: 0 16px 38px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.10);
      backdrop-filter: blur(20px) saturate(1.05);
      -webkit-backdrop-filter: blur(20px) saturate(1.05);
      transition: opacity .18s ease, transform .18s ease;
    }
    .hero.is-changing .hero-products { opacity: .16; transform: translateY(6px); }
    .hero-product-card {
      display: grid;
      grid-template-columns: 58px minmax(0,1fr);
      align-items: center;
      gap: 10px;
      min-width: 0;
      height: 92px;
      padding: 8px 9px 8px 8px;
      overflow: hidden;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: #fff;
      text-align: left;
      cursor: pointer;
      box-shadow: none;
      transition: background .2s ease, transform .2s ease;
    }
    .hero-product-card:hover {
      background: rgba(255,255,255,.12);
      box-shadow: none;
      transform: translateY(-1px);
    }
    .hero-product-card:focus-visible {
      outline: 3px solid rgba(255,255,255,.58);
      outline-offset: 2px;
    }
    .hero-product-image-wrap {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      overflow: hidden;
      border-radius: 12px;
      background: rgba(255,255,255,.94);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.035);
    }
    .hero-product-image { display: block; width: 54px; height: 54px; object-fit: contain; }
    .hero-product-info { min-width: 0; }
    .hero-product-name {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      color: rgba(255,255,255,.96);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .hero-product-price { margin: 5px 0 0; color: rgba(255,255,255,.70); font-size: 11.5px; font-weight: 600; line-height: 1.2; }
    .carousel-arrow {
      position: absolute;
      z-index: 5;
      top: 50%;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(29,29,31,.62);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      opacity: 0;
      transform: translateY(-50%) scale(.92);
      pointer-events: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity .2s ease, transform .2s ease, background .2s ease;
    }
    .carousel-arrow svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
    .carousel-prev { left: 18px; }
    .carousel-next { right: 18px; }
    .hero:hover .carousel-arrow, .carousel-arrow:focus-visible {
      opacity: 1;
      transform: translateY(-50%) scale(1);
      pointer-events: auto;
    }
    .carousel-arrow:hover { background: rgba(29,29,31,.82); }
    .carousel-arrow:active { transform: translateY(-50%) scale(.95); }
    .carousel-pagination {
      position: absolute;
      z-index: 5;
      top: 14px;
      left: 50%;
      bottom: auto;
      display: grid;
      grid-template-columns: repeat(6,minmax(0,1fr));
      align-items: center;
      gap: 0;
      width: min(456px,calc(100% - 180px));
      min-height: 32px;
      padding: 3px;
      overflow: visible;
      border: 0;
      border-radius: 999px;
      background: rgba(18,18,20,.38);
      box-shadow: none;
      transform: translateX(-50%);
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
    }
    .carousel-dot {
      position: relative;
      display: flex;
      width: auto;
      min-width: 0;
      height: 26px;
      align-items: center;
      justify-content: center;
      padding: 0 8px 1px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255,255,255,.62);
      font-size: 12px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
      cursor: pointer;
      text-shadow: 0 1px 7px rgba(0,0,0,.38);
      transition: color .22s ease, background-color .22s ease, transform .22s ease;
    }
    .carousel-dot::after { content: none; }
    .carousel-dot:hover { background: rgba(255,255,255,.1); color: #fff; }
    .carousel-dot.is-active {
      background: rgba(255,255,255,.94);
      color: #1d1d1f;
      box-shadow: none;
      font-weight: 700;
      text-shadow: none;
    }
    .carousel-label { position: relative; z-index: 1; overflow: hidden; text-overflow: ellipsis; }
    .carousel-time {
      display: none;
      position: relative;
      z-index: 1;
      align-items: baseline;
      margin-left: 5px;
      color: rgba(29,29,31,.48);
      font-size: 10px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .carousel-time::before {
      content: "·";
      margin-right: 4px;
      color: rgba(29,29,31,.32);
    }
    .carousel-dot.is-active .carousel-time { display: inline-flex; }
    @media (max-width: 1100px) {
      .hero-copy { width: 52%; padding-left: 42px; padding-right: 32px; }
      .hero-products { width: 48%; }
      .hero-product-card { grid-template-columns: 48px minmax(0,1fr); gap: 8px; padding-left: 8px; padding-right: 9px; }
      .hero-product-image-wrap { width: 48px; height: 48px; }
      .hero-product-image { width: 42px; height: 42px; }
    }
    /* 13-inch / split-panel layout. The host opts into this class before it
       measures the iframe, so the visible cards stay close to their desktop
       size while the overall hero remains compact. */
    html.is-compact-host .hero { height: 500px; min-height: 500px; }
    html.is-compact-host .hero-copy { width: 48%; padding: 48px 32px 48px 44px; }
    html.is-compact-host .hero-title { font-size: 40px; }
    html.is-compact-host .hero-products {
      right: 20px;
      bottom: 24px;
      width: 62%;
      height: 112px;
    }
    html.is-compact-host .carousel-pagination { width: min(456px,calc(100% - 96px)); }
    html.is-compact-host .hero-product-card {
      grid-template-columns: 58px minmax(0,1fr);
      gap: 10px;
      height: 98px;
      padding: 9px 10px;
    }
    html.is-compact-host .hero-product-image-wrap { width: 58px; height: 58px; }
    html.is-compact-host .hero-product-image { width: 54px; height: 54px; }
    html.is-compact-host .hero-product-name { font-size: 14px; }
    html.is-compact-host .hero-product-price { margin-top: 6px; font-size: 12px; }
    /* Short desktop panels keep the scene immersive while revealing the next
       product floor. The host supplies the exact natural height after scaling. */
    html.is-short-host .page { padding-bottom: 10px; }
    html.is-short-host .hero {
      height: var(--short-hero-height, 420px);
      min-height: var(--short-hero-height, 420px);
    }
    html.is-short-host .hero-copy {
      justify-content: flex-start;
      width: 48%;
      padding: 38px 30px 98px 44px;
    }
    html.is-short-host .eyebrow { margin-bottom: 10px; padding: 4px 9px; font-size: 12px; }
    html.is-short-host .product-name { margin-bottom: 5px; font-size: 15px; }
    html.is-short-host .hero-title { max-width: 390px; font-size: 32px; line-height: 1.12; letter-spacing: -1px; }
    html.is-short-host .hero-desc { max-width: 390px; margin-top: 12px; font-size: 13.5px; line-height: 1.55; }
    html.is-short-host .hero-purchase { margin-top: 18px; }
    html.is-short-host .price-symbol { font-size: 14px; }
    html.is-short-host .price-value { font-size: 25px; }
    html.is-short-host .price-suffix { font-size: 11px; }
    html.is-short-host .hero-products {
      right: 20px;
      bottom: 48px;
      width: 68%;
      height: 108px;
    }
    html.is-short-host .hero-product-card {
      grid-template-columns: 58px minmax(0,1fr);
      gap: 10px;
      height: 94px;
      padding: 8px 9px;
    }
    html.is-short-host .hero-product-image-wrap { width: 58px; height: 58px; }
    html.is-short-host .hero-product-image { width: 54px; height: 54px; }
    html.is-short-host .hero-product-name { font-size: 13px; }
    html.is-short-host .hero-product-price { margin-top: 5px; font-size: 11.5px; }
    html.is-short-host .carousel-arrow { width: 40px; height: 40px; }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>

            { name:'YOGA Air 14s', price:'¥7,999', sku:'1030691', image:'/leai product data/shop-chat product data/笔记本/02_SPU_YOGA_Air_14s/白底图.jpg' },
            { name:'USB-C 标准电源适配器', price:'¥149', sku:'1050929', image:'/leai product data/shop-chat product data/选件/11_SPU_联想_USB-C_标准电源适配器/白底图.jpg' },
            { name:'小新蓝牙无线鼠标 Plus', price:'¥59', sku:'1046511', image:'/leai product data/shop-chat product data/选件/10_SPU_联想小新蓝牙无线鼠标_Plus/白底图.jpg' }
          ]
        }
      };
      const sceneKeys = Object.keys(scenes);
      const hero = document.getElementById('bannerHero');
      const eyebrow = document.getElementById('sceneEyebrow');
      const product = document.getElementById('heroProduct');
      const title = document.getElementById('heroTitle');
      const desc = document.getElementById('heroDesc');
      const price = document.getElementById('heroPrice');
      const imageA = document.getElementById('heroImage');
      const imageB = document.getElementById('heroImageNext');
      const prev = document.getElementById('heroPrev');
      const nextButton = document.getElementById('heroNext');
      const pagination = document.getElementById('heroPagination');
      const products = document.getElementById('heroProducts');
      let activeIndex = 0;
      let activeImage = imageA;
      let transitionToken = 0;
      let changeTimer;
      let autoTimer;
      const autoplayDuration = 6500;
      function renderProducts(scene) {
        products.textContent = '';
        products.setAttribute('aria-label', scene.eyebrow + '推荐商品');
        scene.products.forEach(function (item) {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'hero-product-card';
          card.setAttribute('aria-label', '查看' + item.name + '，' + item.price);
          card.innerHTML = '<span class="hero-product-image-wrap"><img class="hero-product-image" alt="" src="' + item.image + '"></span>' +
            '<span class="hero-product-info"><strong class="hero-product-name">' + item.name + '</strong><span class="hero-product-price">' + item.price + '</span></span>';
          card.addEventListener('click', function () {
            window.parent.postMessage({ type:'p0-scene-open-product', sku:item.sku }, location.origin);
          });
          products.appendChild(card);
        });
      }
      renderProducts(scenes[sceneKeys[activeIndex]]);
      sceneKeys.forEach(function (key) {
        const preload = new Image();
        preload.src = scenes[key].image;
      });
      sceneKeys.forEach(function (key, index) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'carousel-dot' + (index === 0 ? ' is-active' : '');
        dot.setAttribute('role', 'tab');
        dot.setAttribute('aria-label', '切换到' + scenes[key].eyebrow);
        dot.setAttribute('aria-current', index === 0 ? 'true' : 'false');
        dot.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
        dot.innerHTML = '<span class="carousel-label">' + scenes[key].eyebrow.replace(/场景$/, '') + '</span>';
        dot.addEventListener('click', function () { goTo(index, true); });
        pagination.appendChild(dot);
      });
      function setScene(index, onCommitted) {
        const normalized = (index + sceneKeys.length) % sceneKeys.length;
        const token = ++transitionToken;
        clearTimeout(changeTimer);
        if (normalized === activeIndex) {
          hero.classList.remove('is-changing');
          if (typeof onCommitted === 'function') onCommitted();
          return;
        }
        const scene = scenes[sceneKeys[normalized]];
        const incomingImage = activeImage === imageA ? imageB : imageA;
        hero.classList.add('is-changing');
        incomingImage.src = scene.image;
        incomingImage.alt = scene.alt;
        incomingImage.setAttribute('aria-hidden', 'false');
        function scheduleCommit() {
          if (token !== transitionToken) return;
          clearTimeout(changeTimer);
          changeTimer = setTimeout(function () {
            if (token !== transitionToken) return;
            activeIndex = normalized;
            eyebrow.textContent = scene.eyebrow;
            product.textContent = scene.product;
            title.textContent = scene.title;
            desc.textContent = scene.desc;
            price.textContent = scene.price;
            renderProducts(scene);
            incomingImage.classList.add('is-active');
            activeImage.classList.remove('is-active');
            activeImage.setAttribute('aria-hidden', 'true');
            activeImage = incomingImage;
            pagination.querySelectorAll('.carousel-dot').forEach(function (dot, dotIndex) {
              const selected = dotIndex === activeIndex;
              dot.classList.toggle('is-active', selected);
              dot.setAttribute('aria-current', selected ? 'true' : 'false');
              dot.setAttribute('aria-selected', selected ? 'true' : 'false');
            });
            requestAnimationFrame(function () { hero.classList.remove('is-changing'); });
            if (typeof onCommitted === 'function') onCommitted();
          },110);
        }
        if (incomingImage.complete && incomingImage.naturalWidth) scheduleCommit();
        else {
          incomingImage.addEventListener('load', scheduleCommit, { once:true });
          incomingImage.addEventListener('error', scheduleCommit, { once:true });
        }
      }
      function pauseAuto() {
        clearTimeout(autoTimer);
        autoTimer = 0;
        hero.classList.add('is-paused');
      }
      function restartProgress() {
        const activeDot = pagination.querySelector('.carousel-dot.is-active');
        if (!activeDot) return;
        activeDot.classList.remove('is-active');
        void pagination.offsetWidth;
        activeDot.classList.add('is-active');
      }
      function startAuto(forceReset) {
        if (autoTimer && !forceReset) {
          hero.classList.remove('is-paused');
          return;
        }
        clearTimeout(autoTimer);
        autoTimer = 0;
        hero.classList.remove('is-paused');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        restartProgress();
        autoTimer = setTimeout(function () {
          autoTimer = 0;
          setScene(activeIndex + 1, function () {
            if (!hero.classList.contains('is-paused')) startAuto(false);
          });
        }, autoplayDuration);
      }
      function goTo(index, fromUser) {
        if (!fromUser) {
          setScene(index);
          return;
        }
        pauseAuto();
        setScene(index, function () { startAuto(true); });
      }
      prev.addEventListener('click', function () { goTo(activeIndex - 1, true); });
      nextButton.addEventListener('click', function () { goTo(activeIndex + 1, true); });
      hero.addEventListener('mouseenter', pauseAuto);
      hero.addEventListener('mouseleave', function () { startAuto(false); });
      hero.addEventListener('focusin', pauseAuto);
      hero.addEventListener('focusout', function (event) {
        if (!hero.contains(event.relatedTarget)) startAuto(false);
      });
      startAuto(true);
      window.parent.postMessage({ type:'p0-scene-dom-ready-v158' }, location.origin);
    })();
  </script>
